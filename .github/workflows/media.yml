name: media
# Fetches the generated scene clips, turns each one into a seamless loop (a short dissolve from
# the end back into the start, nothing ever plays backwards), writes a phone-sized version and a
# poster frame, and commits the results to the site. Runs when this file changes, or on demand
# from the Actions tab. Round 3: the drone clip re-made so it ends on the frame it starts on.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/media.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the generated clips
        run: |
          set -e
          mkdir -p _raw
          f() { curl -fsSL --retry 3 -o "_raw/$1" "$2"; }
          B="https://d8j0ntlcm91z4.cloudfront.net/user_3LMpeOWZGS5ouZ9e711HxP91GHa"
          f drone.mp4 "$B/hf_20261106_194350_f336f983-d404-468c-b45b-c3e0dab1f8c6.mp4"
          ls -la _raw
      - name: Install ffmpeg
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg > /dev/null
          fi
          ffmpeg -hide_banner -version | head -1
      - name: Encode loops, phone versions and posters
        run: |
          set -e
          loop() { # loop <in> <out> <width> <height> <crf> <fade seconds>
            local D TS FX
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$1")
            TS=$(awk "BEGIN{printf \"%.3f\", $D-$6}")
            FX=$(awk "BEGIN{printf \"%.3f\", $6-0.06}")
            ffmpeg -y -hide_banner -loglevel error -i "$1" -filter_complex \
              "[0:v]scale=$3:$4:flags=lanczos,fps=30,format=yuv420p,split=3[a][b][c];[a]trim=start=$TS,setpts=PTS-STARTPTS[tail];[b]trim=end=$6,setpts=PTS-STARTPTS[head];[tail][head]xfade=transition=fade:duration=$FX:offset=0[x];[c]trim=start=$6:end=$TS,setpts=PTS-STARTPTS[mid];[x][mid]concat=n=2:v=1:a=0,format=yuv420p[v]" \
              -map "[v]" -an -c:v libx264 -preset slow -crf "$5" -g 60 -movflags +faststart "$2"
          }
          loop _raw/drone.mp4 drone.mp4   1280 720 23 0.4
          loop _raw/drone.mp4 drone-m.mp4  800 450 27 0.4
          ffmpeg -y -hide_banner -loglevel error -ss 0.3 -i _raw/drone.mp4 -frames:v 1 -vf "scale=1280:720:flags=lanczos" -q:v 3 drone.jpg
          ls -la drone*.mp4 drone.jpg
      - name: Commit the media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drone.mp4 drone-m.mp4 drone.jpg
          git commit -m "Re-make the drone scene so the loop is seamless" || echo "nothing to commit"
          git push
